<svg xmlns="http://www.w3.org/2000/svg" width="960" height="455" viewBox="0 0 960 455" role="img" aria-labelledby="title desc">
  <title id="title">Workload-aware single-residency runtime routing</title>
  <desc id="desc">NInfer is the primary single-agent runtime, llama.cpp is an explicit fallback, and SGLang is the serving runtime. Only one runtime is resident.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:12}.primary{fill:#ecfeff;stroke:#0e7490}.fallback{fill:#fff7ed;stroke:#c2410c}.serving{fill:#eef2ff;stroke:#4338ca}.gate{fill:#f0fdf4;stroke:#15803d}.t{font:600 17px system-ui,sans-serif;fill:#0f172a}.s{font:13px system-ui,sans-serif;fill:#334155}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="455" fill="#ffffff"/>
  <rect class="box" x="350" y="25" width="260" height="72"/>
  <text class="t" x="480" y="56" text-anchor="middle">Task packet</text>
  <text class="s" x="480" y="79" text-anchor="middle">scope · acceptance · lifecycle</text>
  <path class="line" d="M480 97 V142"/>
  <rect class="box" x="350" y="142" width="260" height="72"/>
  <text class="t" x="480" y="173" text-anchor="middle">Purpose classifier</text>
  <text class="s" x="480" y="196" text-anchor="middle">select before model load</text>
  <path class="line" d="M400 214 C350 252 220 250 170 280"/>
  <path class="line" d="M480 214 V280"/>
  <path class="line" d="M560 214 C610 252 740 250 790 280"/>
  <rect class="box primary" x="20" y="280" width="300" height="110"/>
  <text class="t" x="170" y="311" text-anchor="middle">Primary single-agent</text>
  <text class="s" x="170" y="337" text-anchor="middle">NInfer · NVFP4 · FP8 KV · MTP3</text>
  <text class="s" x="170" y="361" text-anchor="middle">240K runtime · 120K agent ceiling</text>
  <rect class="box fallback" x="330" y="280" width="300" height="110"/>
  <text class="t" x="480" y="311" text-anchor="middle">Explicit fallback</text>
  <text class="s" x="480" y="337" text-anchor="middle">llama.cpp · Q5_K_M · Q8 K/V · MTP3</text>
  <text class="s" x="480" y="361" text-anchor="middle">existing measured rollback path</text>
  <rect class="box serving" x="640" y="280" width="300" height="110"/>
  <text class="t" x="790" y="311" text-anchor="middle">Serving / concurrency</text>
  <text class="s" x="790" y="337" text-anchor="middle">SGLang · NVFP4 · FP8 KV · MTP off</text>
  <text class="s" x="790" y="361" text-anchor="middle">existing serving baseline</text>
  <rect class="gate" x="363" y="417" width="234" height="24" rx="12"/>
  <text class="s" x="480" y="434" text-anchor="middle">one GPU · one resident runtime</text>
</svg>
